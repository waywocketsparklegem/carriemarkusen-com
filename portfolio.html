<!doctype html>
<html lang="en" class="grid-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>carrie markusen</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,400;0,800;1,100;1,400&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
    <!-- ?grid at the end of the address (about.html?grid) shows the grid lines. -->
    <script>if (/[?&]grid\b/.test(location.search)) document.documentElement.classList.add("show-grid");</script>
  </head>
  <body>
    <!-- Grid lines (r1-r8 across, c1-c8 down). Hidden in styles.css; unhide .grid-lines to check alignment. -->
    <div class="grid-lines" aria-hidden="true">
      <span class="h h1"></span><span class="h h2"></span><span class="h h3"></span><span class="h h4"></span>
      <span class="h h5"></span><span class="h h6"></span><span class="h h7"></span><span class="h h8"></span>
      <span class="v v1"></span><span class="v v2"></span><span class="v v3"></span><span class="v v4"></span>
      <span class="v v5"></span><span class="v v6"></span><span class="v v7"></span><span class="v v8"></span>
    </div>

    <!-- Top band (r1 to r2): name on the left, page links on the right. -->
    <header class="g-band g-band-top">
      <h1 class="g-h1 g-left">CARRIE MARKUSEN</h1>
      <nav aria-label="pages">
        <a class="g-h1 g-about" href="about.html">ABOUT</a>
        <a class="g-h1 g-portfolio" href="portfolio.html" aria-current="page">PORTFOLIO</a>
      </nav>
    </header>

    <main>
      <!-- Collage: placeholder tiles filling the grid (c2 to c7, r2 to r7), each spanning one or more cells
           (--area: row start / column start / row end / column end, counting grid tracks from 1) in its own tint.
           Each tile will be a project image linking to that project's page. -->
      <nav class="collage" aria-label="projects">
        <a class="tile tile-wide" href="project.html" style="--area: 1 / 1 / 3 / 3; --tint: #0e0e0e" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 1 / 3 / 2 / 4; --tint: #262626" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 1 / 4 / 2 / 6; --tint: #1c1c1c" aria-label="placeholder project"></a>
        <a class="tile tile-wide" href="project.html" style="--area: 2 / 3 / 4 / 5; --tint: #343434" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 2 / 5 / 4 / 6; --tint: #2a2a2a" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 3 / 1 / 6 / 2; --tint: #171717" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 3 / 2 / 5 / 3; --tint: #212121" aria-label="placeholder project"></a>
        <a class="tile" href="project.html" style="--area: 5 / 2 / 6 / 3; --tint: #2f2f2f" aria-label="placeholder project"></a>
        <a class="tile tile-wide" href="project.html" style="--area: 4 / 3 / 6 / 6; --tint: #131313" aria-label="placeholder project"></a>
      </nav>
    </main>

    <!-- Bottom band (r7 to r8). -->
    <footer class="g-band g-band-bottom">
      <p class="g-h1 g-left">:) &lt;3 *</p>
    </footer>
  </body>
</html>
